# Mak ReSearch Training Configuration
# Copy this file to config.yaml and modify as needed

# Model Configuration
model:
  # Base model to use (Qwen, Mistral, DeepSeek, etc.)
  base_model: "Qwen/Qwen1.5-7B-Chat"
  tokenizer: "Qwen/Qwen1.5-7B-Chat"
  
  # Model paths for specialized models
  qwen_path: "Qwen/Qwen1.5-7B-Chat"
  mistral_path: "mistralai/Mistral-7B-v0.1"
  deepseek_path: "deepseek-ai/deepseek-llm-7b-base"
  
  # Model settings
  use_bfloat16: false  # Changed to false as it can cause issues on some GPUs
  device_map: "auto"
  trust_remote_code: true
  
  # Chat mode settings
  chat_mode: true
  chat_template: "qwen"
  system_prompt: "You are a helpful AI assistant trained to provide accurate and informative responses."
  
  # Model-specific settings
  qwen:
    use_cache: false  # Required for training
    chat_format: "chatml"
    
  mistral:
    use_cache: false
    chat_format: "chatml"
    
  deepseek:
    use_cache: false
    chat_format: "chatml"

# Training Configuration
training:
  # Basic settings
  batch_size: 1  # Keep at 1 for minimal memory usage
  max_seq_len: 256  # Reduced from 512 to save memory
  num_epochs: 3
  learning_rate: 0.00002
  gradient_accumulation_steps: 8  # Increased to compensate for smaller batch size
  warmup_steps: 10
  weight_decay: 0.01
  
  # Optimization
  optimizer: "adamw"
  scheduler: "cosine"
  max_grad_norm: 1.0
  
  # Mixed precision
  fp16: true
  bf16: false
  
  # Checkpointing
  save_steps: 5
  save_total_limit: 2  # Reduced to save disk space
  output_dir: "./results"
  
  # Logging
  logging_steps: 1
  evaluation_steps: 5
  report_to: "none"  # Disable wandb to save memory

# Search Configuration
search:
  # Embedding model
  embedding_model: "BAAI/bge-large-en-v1.5"
  embedding_dim: 1024
  embedding_device: "cuda"
  
  # Keyword model
  keyword_model: "BM25"
  fusion_strategy: "weighted"
  embedding_weight: 0.7
  keyword_weight: 0.3
  
  # Search settings
  top_k: 5
  min_score: 0.5  # Minimum relevance score for search results
  score_threshold: 0.5
  max_tokens: 512
  
  # Cache settings
  use_cache: true
  cache_path: "./cache/search_results.json"
  cache_size: 10000

# GRPO Configuration
grpo:
  # Loss weights
  alpha: 0.1  # Search result masking weight
  beta: 0.5   # Policy loss weight
  gamma: 0.3  # Value loss weight
  
  # PPO settings
  max_kl: 0.1
  clip_range: 0.2
  value_clip_range: 0.2
  entropy_coef: 0.01
  
  # Advantage estimation
  gae_lambda: 0.95
  gamma: 0.99
  
  # Training settings
  ppo_epochs: 4
  mini_batch_size: 1

# Generation Configuration
generation:
  # Basic settings
  max_length: 2048
  min_length: 50
  num_beams: 4
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  do_sample: true
  early_stopping: true
  
  # Search integration
  use_search: true
  search_weight: 0.3
  max_search_results: 5
  search_threshold: 0.5
  
  # Output settings
  num_return_sequences: 1
  output_scores: true
  return_dict_in_generate: true

# Dataset Configuration
dataset:
  # MuSiQue settings
  musique:
    path: "data/musique/train.json"
    split: "train"
    shuffle: true
    seed: 42
    
  # Custom data settings
  custom:
    path: "data/transcripts/train.json"
    format: "jsonl"
    shuffle: true
    seed: 42
    
  # Preprocessing
  preprocessing:
    max_length: 2048
    padding: "max_length"
    truncation: true
    return_tensors: "pt"

# Evaluation Configuration
evaluation:
  # Metrics
  metrics:
    - "rouge"
    - "bleu"
    - "accuracy"
    - "f1"
    
  # Generation settings
  generation:
    max_length: 2048
    num_beams: 1
    do_sample: true
    temperature: 0.7
    top_p: 0.9
    
  # Search evaluation
  search_eval:
    relevance_threshold: 0.5
    diversity_threshold: 0.3
    
  # Output settings
  output_dir: "./results"
  save_predictions: true
  save_metrics: true

# System Configuration
system:
  # Hardware settings
  num_gpus: 1
  mixed_precision: "fp16"
  gradient_checkpointing: true
  use_memory_efficient_attention: true
  
  # Memory settings
  max_memory: 10  # Reduced from 12 to leave some headroom
  offload_folder: "./offload"
  use_cpu_offload: true
  
  # Logging settings
  log_level: "INFO"
  log_file: "./logs/training.log"
  
  # Monitoring
  use_wandb: false  # Disabled to save memory
  wandb_project: "mak-research"
  wandb_entity: "your-username" 